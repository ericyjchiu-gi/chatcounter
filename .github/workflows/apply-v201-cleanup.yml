name: Apply v2.0.1 clean repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[clean-v201-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean source bundle
        run: |
          echo "6f51eb6a2db555f027fcb8bd9902edff1a836ecfa7cf715f2b7470bee4140e93  .cleanup/source.zip" | sha256sum -c -
          mkdir /tmp/chatcounter-clean
          unzip -q .cleanup/source.zip -d /tmp/chatcounter-clean
          test -f /tmp/chatcounter-clean/manifest.json
          test -f /tmp/chatcounter-clean/README.md
          test -f /tmp/chatcounter-clean/src/background/worker-store.js

      - name: Replace repository with v2.0.1 clean tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/chatcounter-clean/. .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate clean repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python tools/test.py
          python tools/package.py

      - name: Commit clean v2.0.1 repository
        run: |
          git config user.name "ericyjchiu-gi"
          git config user.email "eric@gi-ww.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean repository for v2.0.1 [clean-v201-done]"
          git push origin HEAD:main
