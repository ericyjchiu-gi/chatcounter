name: Validate and package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package-validation dependency
        run: python3 -m pip install Pillow
      - name: Validate source, reference hashes, icons and release package
        run: python3 tools/package.py
      - name: Tag release without overwriting an existing tag
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            test "$(git rev-parse "v${VERSION}^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "v${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chatcounter-universal
          path: dist/*.zip
