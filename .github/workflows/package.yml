name: Validate and package
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and package committed source
        run: python3 tools/package.py
      - name: Point the version tag at the validated release commit
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git tag -f "v${VERSION}" HEAD
          git push --force origin "refs/tags/v${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: chatcounter-universal
          path: dist/*.zip
