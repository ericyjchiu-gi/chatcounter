name: Remove stale build branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[prune-branches]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete build and release branches
        run: |
          git push origin --delete build-v1.8.0 build-v1.8.5 build-v1.9.0 release-v1.9.0
