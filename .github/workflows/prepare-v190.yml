name: Verify release source recovery
on:
  push:
    branches: [release-v1.9.0]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export saved release source objects for byte comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('source-objects.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(Path('.build/recovery').glob('part-*')):
              z.write(p,p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-objects
          path: source-objects.zip
