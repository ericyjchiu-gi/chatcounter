name: Assemble validated 1.9 release
on:
  push:
    branches: [build-v1.9.0]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-v1.9.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and reconstruct release source
        run: python3 .build/assemble_v190.py
      - name: Validate all runtime files and package
        run: |
          python3 -m pip install Pillow
          python3 tools/package.py
      - name: Commit source without requesting workflow permissions
        run: |
          git restore --source=HEAD --worktree -- .github/workflows
          git config user.name "ChatCounter release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble validated 1.9 source and archived release notes"
          git push origin HEAD:build-v1.9.0
          python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatcounter-universal
          path: dist/*.zip
